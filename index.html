<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经营看板</title>
<style>
  /* 三种主题状态都要覆盖：明确选亮 / 明确选暗 / 跟随系统（根元素上什么都不带）。
     只写 prefers-color-scheme，"明确选择"那两种状态就拿不到颜色。 */
  :root{--bg:#f3f4f6;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e2e5ea;
        --brand:#8e161d;--bad:#c0392b}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#14161a;--card:#1d2027;--ink:#e8eaee;
      --sub:#98a0ae;--line:#2b3039;--brand:#d4636a;--bad:#e8817a}}
  :root[data-theme="dark"]{--bg:#14161a;--card:#1d2027;--ink:#e8eaee;
    --sub:#98a0ae;--line:#2b3039;--brand:#d4636a;--bad:#e8817a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:28px 26px;box-shadow:0 8px 28px rgba(0,0,0,.07)}
  h1{margin:0 0 4px;font-size:17px;letter-spacing:.2px}
  .sub{margin:0 0 20px;color:var(--sub);font-size:13px}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  input{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);
        border-radius:9px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--brand);outline-offset:1px}
  button{width:100%;margin-top:14px;padding:11px;font-size:15px;border:0;border-radius:9px;
         background:var(--brand);color:#fff;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:12px;font-size:13px;min-height:19px}
  .err{color:var(--bad)}.ok{color:var(--sub)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style></head><body>
<div id="gate"><div class="box">
  <h1>经营看板</h1>
  <p class="sub">这份看板已加密，请输入查看密码。</p>
  <form id="f" autocomplete="off">
    <label for="pw">查看密码</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">打开看板</button>
  </form>
  <div class="msg" id="m"></div>
</div></div>

  function say(t, bad){ m.textContent = t; m.className = 'msg ' + (bad ? 'err' : 'ok'); }
  function b64(s){ var r = atob(s), a = new Uint8Array(r.length);
                   for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }

  /* 两条解密路径，解的是**同一份密文**：
       · 浏览器有 WebCrypto（https / localhost）→ 用它，约 0.3 秒
       · 没有（直接双击本地文件，Chrome 在 file:// 下不提供）→ 退到内置的纯 JS，约 1 秒
     为什么要有第二条：这个文件的实际用法就是发给同事，同事会双击。
     第一版只有 WebCrypto，双击打开只能显示"请用网址打开"——
     等于把一个"发文件"的场景硬掰成"搭网站"，用的人每次都卡在这。 */
  function toBytes(bits){                 // sjcl 的 bitArray → Uint8Array
    var hex = SJCL.codec.hex.fromBits(bits), n = hex.length / 2;
    var a = new Uint8Array(n);
    for (var i = 0; i < n; i++) a[i] = parseInt(hex.substr(i * 2, 2), 16);
    return a;
  }
  async function ungzip(buf){
    if (window.DecompressionStream) {
      var ds = new DecompressionStream('gzip');
      return await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
    }
    throw new Error('nogzip');
  }
  async function unlock(pass){
    var plain;
    if (window.crypto && window.crypto.subtle) {
      var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
                                              'PBKDF2', false, ['deriveKey']);
      var aes = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:b64(D.s), iterations:D.n, hash:'SHA-256' },
        key, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      /* 解不开就是密码错——GCM 的完整性校验会失败并抛异常。
         所以文件里不需要存任何"密码哈希"，也就没有可以离线爆破的东西。 */
      plain = await crypto.subtle.decrypt(
        { name:'AES-GCM', iv:b64(D.i) }, aes, b64(D.c));
    } else {
      var B = SJCL.codec.base64;
      var k = SJCL.misc.pbkdf2(pass, B.toBits(D.s), D.n, 256);
      // 同样靠 GCM 的校验判断密码对不对：错了这里就抛异常
      var bits = SJCL.mode.gcm.decrypt(new SJCL.cipher.aes(k),
                                       B.toBits(D.c), B.toBits(D.i), [], 128);
      plain = toBytes(bits).buffer;
    }
    if (D.z) plain = await ungzip(plain);
    return new TextDecoder().decode(plain);
  }

  document.getElementById('f').addEventListener('submit', async function(e){

    if (!pass) { say('请输入密码', true); return; }
    go.disabled = true; say('正在解密…（首次约 1 秒）');

      var f = document.createElement('iframe');
      f.setAttribute('title', document.title);
      document.body.innerHTML = ''; document.body.appendChild(f);
      f.srcdoc = html;
